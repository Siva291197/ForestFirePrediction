<html>
  <head>
      <meta charset = 'UTF-8'>
      <title>FWI Prediction</title>
  </head>
   <body>    
    <form action = "{{url_for('predict_data')}}" method = 'POST'>
        <label>Temperature</label>
        <input type ='text' name='Temperature' value = "{{Temperature}}" required='required' /><br>
        <label>RH</label>
        <input type ='text' name='RH' value = "{{RH}}" required='required' /><br>
        <label>Ws</label>
        <input type ='text' name='Ws' value = "{{Ws}}" required='required' /><br>
        <label>Rain</label>
        <input type ='text' name='Rain' value = "{{Rain}}" required='required' /><br>
        <label>FFMC</label>
        <input type ='text' name='FFMC' value = "{{FFMC}}" required='required' /><br>
        <label>DMC</label>
        <input type ='text' name='DMC' value = "{{DMC}}" required='required' /><br>
        <label>ISI</label>
        <input type ='text' name='ISI' value = "{{ISI}}" placeholder='ISI' required='required' /><br>
        <input type ='text' name='Classes' value = "{{Classes}}" placeholder='Classes' required='required' /><br>
        <input type ='text' name='Region' value = "{{Region}}" placeholder='REGION' required='required' /><br>
        
        <button type ='submit' class ="btn btn-primary btn-block btn-large">Predict</button>
    </form>
    <h1>
        The FWI Prediction is {{results}}
    </h1>
   </body>
</html>
